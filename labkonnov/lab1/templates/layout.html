<!doctype html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %} Приложение Django {% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}" />
        <script src="{% static 'js.js' %}" defer></script>
        <style>
            .log{
            
                background-color: #e3f5f3;
                border-radius: 10px;
                border: 2px solid rgb(255, 4, 46);
                width: 100px;
                height: 30px;
                margin-top: 2px;
            }
        </style>
    </head>
    <body>
        <div class="but">
            <li><a href="/">Главная</a></li>
            <li><a href="/about">Обо мне</a></li>
            <li><a href="{% url 'posts:list' %}"> Посты</a></li>
            <li><a href="{% url 'communities:list' %}">Сообщества</a></li>
            {% if user.is_authenticated %}
            {% else %}
                <li><a href="{% url 'users:register' %}">
                    Зарегистрироваться
                </a></li>
                <li><a href="{% url 'users:login' %}">
                    Войти
                </a></li>
            {% endif %}
            
            <form class="logout" action="{% url 'users:logout' %}" method="post">
                {% csrf_token %}
                <button class="log" title="User Logout">Выйти</button>
            </form>
            <main>{% block content %} {% endblock %}</main>
        </div>
    </body>
</html>
